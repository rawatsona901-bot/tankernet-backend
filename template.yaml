AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  TankerNet - Water Tanker Quality and Delivery Verification System Backend.
  Includes API Gateway, Lambda (Python 3.12), DynamoDB, AWS IoT Core Rules,
  and Amazon Bedrock integration.

Globals:
  Function:
    Runtime: python3.14
    Timeout: 30
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TANKERS_TABLE: !Ref TankersTable
        BOOKINGS_TABLE: !Ref BookingsTable
        RECEIPTS_TABLE: !Ref ReceiptsTable
        BEDROCK_MODEL_ID: "anthropic.claude-3-haiku-20240307-v1:0"
        USE_LOCAL_PARSER: "false"

Resources:
  # =========================================================================
  # API GATEWAY
  # =========================================================================
  TankerNetApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'OPTIONS,POST,GET,PUT'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

  # =========================================================================
  # DYNAMODB TABLES
  # =========================================================================
  TankersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TankerNet-Tankers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tanker_id
          AttributeType: S
      KeySchema:
        - AttributeName: tanker_id
          KeyType: HASH

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TankerNet-Bookings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: booking_id
          AttributeType: S
      KeySchema:
        - AttributeName: booking_id
          KeyType: HASH

  ReceiptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TankerNet-Receipts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: booking_id
          AttributeType: S
      KeySchema:
        - AttributeName: booking_id
          KeyType: HASH

  # =========================================================================
  # LAMBDA FUNCTIONS
  # =========================================================================

  # 1. Booking Creation (POST /api/booking/create)
  CreateBookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src.handlers.booking_handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TankersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - Statement:
            - Sid: BedrockInvokePolicy
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        CreateBooking:
          Type: Api
          Properties:
            RestApiId: !Ref TankerNetApi
            Path: /api/booking/create
            Method: POST

  # 2. Telemetry Ingestion (POST /api/tanker/telemetry & IoT Rule)
  TelemetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src.handlers.telemetry_handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TankersTable
      Events:
        TelemetryApi:
          Type: Api
          Properties:
            RestApiId: !Ref TankerNetApi
            Path: /api/tanker/telemetry
            Method: POST

  # 3. Tanker Valve Unlock (POST /api/tanker/unlock)
  UnlockTankerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src.handlers.unlock_handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TankersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ReceiptsTable
        - Statement:
            - Sid: IoTPublishPolicy
              Effect: Allow
              Action:
                - iot:Publish
              Resource: !Sub "arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/tanker/*/valve"
      Events:
        UnlockTanker:
          Type: Api
          Properties:
            RestApiId: !Ref TankerNetApi
            Path: /api/tanker/unlock
            Method: POST

  # 4. Quality Receipt (GET /api/receipt/{booking_id})
  GetReceiptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src.handlers.receipt_handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReceiptsTable
      Events:
        GetReceipt:
          Type: Api
          Properties:
            RestApiId: !Ref TankerNetApi
            Path: /api/receipt/{booking_id}
            Method: GET

  # 5. Admin Metrics (GET /api/admin/metrics)
  AdminMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: src.handlers.admin_handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TankersTable
      Events:
        AdminMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref TankerNetApi
            Path: /api/admin/metrics
            Method: GET

  # =========================================================================
  # AWS IOT CORE TOPIC RULE & PERMISSIONS
  # =========================================================================
  TankerTelemetryTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: TankerNetTelemetryForwarder
      TopicRulePayload:
        RuleDisabled: false
        Sql: "SELECT * FROM 'tanker/+/telemetry'"
        Description: "Forward MQTT tanker telemetry messages to the TelemetryFunction"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt TelemetryFunction.Arn

  TelemetryFunctionIoTPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TelemetryFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt TankerTelemetryTopicRule.Arn

# =========================================================================
# OUTPUTS
# =========================================================================
Outputs:
  TankerNetApiEndpoint:
    Description: "API Gateway base URL for TankerNet"
    Value: !Sub "https://${TankerNetApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  TankersTableName:
    Description: "DynamoDB Tankers Table Name"
    Value: !Ref TankersTable

  BookingsTableName:
    Description: "DynamoDB Bookings Table Name"
    Value: !Ref BookingsTable

  ReceiptsTableName:
    Description: "DynamoDB Receipts Table Name"
    Value: !Ref ReceiptsTable
